
name: Java CI-CD with Kubernetes

on:
  push:
    branches: [practice]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Java Application
    runs-on: self-hosted
    #  runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: mvn -B -DskipTests package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: target/hello-world-1.0.jar
          retention-days: 1

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Execute Tests
        run: mvn -B test

  docker-build:
    name: Build and Push Docker Image
    needs: [build, unit-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-jar
          path: target/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-java:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-java:latest

  deploy:
    name: Deploy to Minikube
    needs: docker-build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply Kubernetes Configuration
        run: kubectl apply -f k8s/

      - name: Update Application Image
        run: |
          kubectl set image deployment/hello-java \
            hello-java=${{ secrets.DOCKERHUB_USERNAME }}/hello-java:${{ github.sha }}

      - name: Verify Deployment
        run: kubectl rollout status deployment/hello-java --timeout=180s

